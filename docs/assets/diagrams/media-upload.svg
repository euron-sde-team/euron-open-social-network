<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">Media upload</title>
  <desc id="d">The browser asks the API for an upload ticket, uploads straight to the private bucket with a presigned PUT, then asks the API to complete it. The API checks the stored size and the file's magic bytes, and the worker strips metadata and makes a thumbnail. Content references the upload by id.</desc>
  <style>
    .t { font-family: Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    .m { font-family: JetBrains Mono, SFMono-Regular, Menlo, monospace; }
    .h { font-size: 16px; font-weight: 650; fill: #edf1ff; }
    .s { font-size: 13px; fill: #97a3c2; }
    .x { font-size: 12px; fill: #6f7b9c; }
    .box { fill: #111833; stroke: #283258; stroke-width: 1.2; }
    .hot { fill: #111d3d; stroke: #5b8cff; stroke-opacity: 0.6; stroke-width: 1.4; }
    .bad { fill: #2a1420; stroke: #f87171; stroke-opacity: 0.55; stroke-width: 1.3; }
    .ok { fill: #0f2421; stroke: #34d399; stroke-opacity: 0.5; stroke-width: 1.3; }
    .warn { fill: #2a2312; stroke: #fbbf24; stroke-opacity: 0.55; stroke-width: 1.3; }
    .arrow { stroke: #4b5778; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arrowhot { stroke: #5b8cff; stroke-opacity: 0.85; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .life { stroke: #283258; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5778"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8cff"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/></pattern>
  </defs>
  <rect width="1280" height="560" rx="16" fill="#0a0f1c"/>
  <rect width="1280" height="560" rx="16" fill="url(#grid)"/>
  <g class="t">
    <text class="h" x="40" y="52" style="font-size:22px">Uploading a photo</text>
    <text class="s" x="40" y="76">Bytes never pass through the API, and content can only reference uploads you own that passed inspection.</text>

    <rect class="box" x="60" y="104" width="180" height="44" rx="10"/><text class="h" x="104" y="132">Browser</text>
    <rect class="hot" x="420" y="104" width="180" height="44" rx="10"/><text class="h" x="492" y="132">API</text>
    <rect class="box" x="780" y="104" width="180" height="44" rx="10"/><text class="h" x="814" y="132">S3 (private)</text>
    <rect class="box" x="1040" y="104" width="180" height="44" rx="10"/><text class="h" x="1100" y="132">worker</text>
    <line class="life" x1="150" y1="148" x2="150" y2="510"/>
    <line class="life" x1="510" y1="148" x2="510" y2="510"/>
    <line class="life" x1="870" y1="148" x2="870" y2="510"/>
    <line class="life" x1="1130" y1="148" x2="1130" y2="510"/>

    <path class="arrowhot" d="M150 188 H506"/>
    <text class="m x" x="166" y="180">POST /api/media/uploads {type, size}</text>
    <path class="arrow" d="M510 224 H154"/>
    <text class="s" x="190" y="216">allowlist + size limit; presigned PUT (10 min)</text>

    <path class="arrowhot" d="M150 266 H866"/>
    <text class="m x" x="300" y="258">PUT bytes with the signed Content-Type and length</text>

    <path class="arrowhot" d="M150 308 H506"/>
    <text class="m x" x="166" y="300">POST /uploads/:id/complete</text>
    <path class="arrow" d="M510 336 H866"/>
    <text class="s" x="560" y="328">HEAD size == declared, read first 4 KB</text>
    <text class="s" x="560" y="360">magic bytes must match the type (no SVG, no HTML)</text>
    <path class="arrow" d="M510 392 H1126"/>
    <text class="m x" x="760" y="384">job media.process</text>
    <text class="s" x="904" y="424">auto-rotate, strip EXIF/GPS,</text>
    <text class="s" x="904" y="444">640px WebP thumbnail, READY</text>

    <path class="arrowhot" d="M150 478 H506"/>
    <text class="m x" x="166" y="470">POST /api/posts {mediaIds: [id]}</text>
    <text class="s" x="560" y="482">claimUploads(): yours, finished, unused, right purpose</text>

    <text class="x" x="40" y="536">Reads use short-lived signed GET URLs. Unattached uploads expire after 48 hours. Locally the API stands in for S3 with HMAC-signed URLs.</text>
  </g>
</svg>
