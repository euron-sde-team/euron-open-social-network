<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open Social</title>
  <desc id="d">Open-source, community-backed social network with real-time messaging and AI-assisted moderation, built for AWS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="140" fill="#f3f6ff" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open Social</text>
    <text x="74" y="186" fill="#97a3c2" font-size="22" font-weight="400">Communities, feeds and real-time messaging, on infrastructure you own.</text>
    <text x="74" y="246" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7f8bab" xml:space="preserve">Socket.IO realtime<tspan fill="#2a3352">  /  </tspan>AI moderation<tspan fill="#2a3352">  /  </tspan>Terraform for AWS<tspan fill="#2a3352">  /  </tspan>MIT</text>
  </g>

  <!-- A small feed motif: three post cards and a chat bubble -->
  <g transform="translate(900 30)">
    <rect x="0" y="0" width="300" height="64" rx="12" fill="#121a33" stroke="#26315a"/>
    <circle cx="30" cy="32" r="13" fill="#5b8cff" fill-opacity="0.85"/>
    <rect x="54" y="21" width="150" height="9" rx="4.5" fill="#3a4672"/>
    <rect x="54" y="37" width="210" height="8" rx="4" fill="#26315a"/>

    <rect x="0" y="76" width="300" height="64" rx="12" fill="#121a33" stroke="#26315a"/>
    <circle cx="30" cy="108" r="13" fill="#a78bfa" fill-opacity="0.85"/>
    <rect x="54" y="97" width="120" height="9" rx="4.5" fill="#3a4672"/>
    <rect x="54" y="113" width="160" height="8" rx="4" fill="#26315a"/>
    <g transform="translate(232 98)"><circle cx="0" cy="10" r="9" fill="#5b8cff"/><circle cx="14" cy="10" r="9" fill="#f472b6"/><circle cx="28" cy="10" r="9" fill="#fbbf24"/></g>

    <rect x="0" y="152" width="300" height="64" rx="12" fill="#121a33" stroke="#26315a"/>
    <circle cx="30" cy="184" r="13" fill="#34d399" fill-opacity="0.85"/>
    <rect x="54" y="173" width="160" height="9" rx="4.5" fill="#3a4672"/>
    <rect x="54" y="189" width="130" height="8" rx="4" fill="#26315a"/>

    <path d="M180 226 h108 a12 12 0 0 1 12 12 v20 a12 12 0 0 1 -12 12 h-80 l-14 11 v-11 h-14 a12 12 0 0 1 -12 -12 v-20 a12 12 0 0 1 12 -12z" fill="#2557d6"/>
    <circle cx="214" cy="248" r="3.5" fill="#dbe5ff"/><circle cx="228" cy="248" r="3.5" fill="#dbe5ff"/><circle cx="242" cy="248" r="3.5" fill="#dbe5ff"/>
  </g>
  <rect x="72" y="282" width="420" height="3" rx="1.5" fill="url(#glow)"/>
</svg>
