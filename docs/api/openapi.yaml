openapi: 3.1.0
info:
  title: Euron Open Social API
  version: 0.1.0
  description: |
    REST API of Euron Open Social. Sign in with POST /api/auth/login to get a short-lived access
    token (send it as `Authorization: Bearer <token>`) and an httpOnly refresh cookie that
    POST /api/auth/refresh rotates. Realtime events use Socket.IO on /socket.io with the same token.
    Errors are `{ "error": string, "code"?: string }`; unexpected failures return 500 with a
    `requestId` and never the underlying message.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:3510
    description: Local stack (make up), through the web app's proxy
  - url: https://{host}
    variables: { host: { default: app.example.com } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Access token from POST /api/auth/login or /api/auth/refresh." }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, requestId: { type: string } }
