  - name: "auth"
    description: "sign-up, sign-in, sessions, email verification, password reset and two-factor."
  - name: "users"
    description: "profiles, the follow graph, blocks, your own profile, bookmarks and sessions."
  - name: "communities"
    description: "the directory, community settings, membership and join requests, member moderation, invites and community feeds."
  - name: "posts"
    description: "the home feed, posts, reactions, bookmarks, pinning, locking and comments on a post."
  - name: "comments"
    description: "replies, editing, deleting and reacting to comments."
  - name: "polls"
    description: "polls attached to posts."
  - name: "questions"
    description: "community Q&A with votes and accepted answers."
  - name: "events"
    description: "community and network-wide events, RSVPs with capacity and a waitlist, calendar export."
  - name: "chat"
    description: "the live chat room of each community, for its active members."
  - name: "dms"
    description: "1:1 and group conversations, message requests, reactions, pins, read state and contacts."
  - name: "media"
    description: "direct-to-storage uploads, media lookup, and the local-storage stand-in for presigned URLs."
  - name: "notifications"
    description: "your notification inbox."
  - name: "discover"
    description: "search, typeahead, trending tags, tag pages and the leaderboard."
  - name: "reports"
    description: "members flag content and accounts for the moderators."
  - name: "moderation"
    description: "the case queue for staff and community moderators, appeals, and authors' own cases."
  - name: "admin"
    description: "the platform console for staff (read) and admins (change)."
  - name: "meta"
    description: "public network facts (name, registration mode) for page titles and the sign-up form."
